# Teste público de CINZAS DO MERIDIANO: servidor de zona + serviço de contas + proxy TLS (Caddy).
# Ver docs/08-operacao.md §8.8 e §8.9.
#
#   cd deploy
#   cat > .env <<'FIM'                                 # deploy/.env fica fora do git
#   DOMINIO=jogo.exemplo.com.br                       # domínio real, com DNS apontando para esta máquina
#   CINZAS_TOKEN_SECRET=<openssl rand -hex 32>         # segredo compartilhado pela zona e pelas contas
#   CINZAS_EMAIL=smtp                                  # "arquivo" grava os e-mails em /data/emails (testes)
#   CINZAS_SMTP_HOST=smtp.exemplo.com.br
#   CINZAS_SMTP_PORT=587
#   CINZAS_SMTP_USER=...
#   CINZAS_SMTP_PASS=...
#   CINZAS_SMTP_FROM=Cinzas do Meridiano <nao-responda@exemplo.com.br>
#   FIM
#   docker compose up -d --build
#   docker compose logs -f servidor
#
# Os jogadores conectam em wss://jogo.exemplo.com.br (campo "Servidor" do cliente ou --server=...); o
# cliente cria a conta e pede o token em https://jogo.exemplo.com.br/contas (serviço "contas").
# Portas abertas na internet: só 80 e 443 (proxy). O jogo (7777) fica na rede interna do compose e as
# métricas/saúde (9100) só no 127.0.0.1 desta máquina: curl http://127.0.0.1:9100/health
#
# Banco: sem nada a mais, SQLite no volume "dados". PostgreSQL central (perfil "postgres", docs §8.11):
#   install -d -m 0700 segredos
#   openssl rand -hex 24 > segredos/senha_banco.txt                # senha do banco, fora do git
#   sudo chown 10001:10001 segredos/senha_banco.txt && chmod 0600 segredos/senha_banco.txt
#   cat >> .env <<'FIM'
#   COMPOSE_PROFILES=postgres                          # sobe o serviço "banco" (postgres:17)
#   CINZAS_DB=postgres://cinzas@banco:5432/cinzas      # zona e contas usam o banco; a senha vem do arquivo
#   CINZAS_DB_SENHA_ARQUIVO=./segredos/senha_banco.txt
#   FIM
#   docker compose up -d --build
# Backup no PostgreSQL: docker compose exec -T banco pg_dump -U cinzas -Fc cinzas > cinzas-AAAA-MM-DD.dump
name: cinzas

services:
  servidor:
    # Construída a partir deste repositório. Para usar a imagem publicada pelo CI (release.yml), troque
    # "build" por:  image: ghcr.io/<dono-do-repositório>/cinzas-servidor:<versão>
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cinzas-servidor:local
    restart: unless-stopped
    init: true
    # SIGTERM -> o servidor salva todos os personagens e fecha o banco; 45 s de prazo antes do SIGKILL
    stop_grace_period: 45s
    volumes:
      - dados:/data              # cinzas.db (+ -wal/-shm) e backups/
    # perfil "postgres": espera o banco aceitar conexões (sem o perfil a dependência é ignorada)
    depends_on:
      banco:
        condition: service_healthy
        required: false
    secrets: [senha_banco]
    environment:
      # arquivo SQLite no volume ou postgres://cinzas@banco:5432/cinzas (perfil "postgres", senha do arquivo)
      CINZAS_DB: ${CINZAS_DB:-/data/cinzas.db}
      CINZAS_DB_PASSWORD_FILE: /run/secrets/senha_banco
      # login só com token do serviço de contas (cadastro e senha direto na zona ficam desligados)
      CINZAS_AUTH: ${CINZAS_AUTH:-token}
      CINZAS_TOKEN_SECRET: ${CINZAS_TOKEN_SECRET:?defina CINZAS_TOKEN_SECRET em deploy/.env}
      CINZAS_TRUST_PROXY: "1"    # o IP real vem do X-Forwarded-For do Caddy (limite por IP, auditoria)
      CINZAS_MAX_CONN_PER_IP: ${CINZAS_MAX_CONN_PER_IP:-8}
      CINZAS_LOG_FORMAT: json
    expose:
      - "7777"                   # alcançável só pelo proxy (rede interna)
    ports:
      - "127.0.0.1:9100:9100"    # métricas Prometheus e /health: só nesta máquina, nunca na internet
    # Teste em rede local sem TLS (ws://IP:7777): descomente. Não use no teste público.
    #   - "7777:7777"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      servidor:
        condition: service_healthy
      contas:
        condition: service_healthy
    ports:
      - "80:80"                  # desafio HTTP do Let's Encrypt e redirecionamento para HTTPS
      - "443:443"                # wss:// do jogo
    environment:
      DOMINIO: ${DOMINIO:-jogo.exemplo.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data        # certificados e chaves do TLS: não apague (limites de emissão)
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  contas:
    # Serviço de contas (cadastro com e-mail, confirmação, token de sessão de 5 min, troca de senha,
    # exportação e exclusão de conta, termos). Mesma imagem, mesmo banco (volume "dados").
    image: cinzas-servidor:local
    restart: unless-stopped
    init: true
    depends_on:
      servidor:
        condition: service_healthy
      banco:
        condition: service_healthy
        required: false
    command: ["node", "--disable-warning=ExperimentalWarning", "src/contas-main.js", "--port", "7780", "--host", "0.0.0.0", "--email-dir", "/data/emails"]
    volumes:
      - dados:/data
    secrets: [senha_banco]
    environment:
      CINZAS_DB: ${CINZAS_DB:-/data/cinzas.db}      # o mesmo banco da zona
      CINZAS_DB_PASSWORD_FILE: /run/secrets/senha_banco
      CINZAS_TOKEN_SECRET: ${CINZAS_TOKEN_SECRET:?defina CINZAS_TOKEN_SECRET em deploy/.env}
      CINZAS_TRUST_PROXY: "1"
      CINZAS_EMAIL: ${CINZAS_EMAIL:-arquivo}
      CINZAS_SMTP_HOST: ${CINZAS_SMTP_HOST:-}
      CINZAS_SMTP_PORT: ${CINZAS_SMTP_PORT:-587}
      CINZAS_SMTP_USER: ${CINZAS_SMTP_USER:-}
      CINZAS_SMTP_PASS: ${CINZAS_SMTP_PASS:-}
      CINZAS_SMTP_FROM: ${CINZAS_SMTP_FROM:-}
    expose:
      - "7780"                   # alcançável só pelo proxy (https://DOMINIO/contas/...)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7780/saude',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- PostgreSQL central (opcional): perfil "postgres" — ver o cabeçalho e docs/08-operacao.md §8.11 ----
  # Zona e contas passam a usar este banco com CINZAS_DB=postgres://cinzas@banco:5432/cinzas no .env; a
  # senha (segredo senha_banco) vem de deploy/segredos/senha_banco.txt, que fica fora do git.
  banco:
    image: postgres:17
    profiles: ["postgres"]
    restart: unless-stopped
    stop_grace_period: 60s     # desligamento "fast": desfaz transações abertas e grava o checkpoint
    environment:
      POSTGRES_USER: cinzas
      POSTGRES_DB: cinzas
      POSTGRES_PASSWORD_FILE: /run/secrets/senha_banco
      # C.UTF-8: ordem por código (como o SQLite) e índices que não mudam quando a glibc da imagem muda
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets: [senha_banco]
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      # por TCP: na primeira inicialização o servidor temporário só escuta no soquete local, e um
      # pg_isready pelo soquete daria "pronto" antes da hora
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U cinzas -d cinzas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # sem "ports": o banco nunca fica exposto fora da rede interna do compose
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- Monitoramento (opcional): docker compose --profile monitoramento up -d -----------------------
  # Prometheus coleta as métricas da zona (servidor:9100) e avalia os alertas de monitoramento/alertas.yml;
  # Grafana mostra o painel pronto em http://127.0.0.1:3000 (só nesta máquina; use um túnel SSH de fora).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoramento"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoramento/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_dados:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoramento"]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:-troque-esta-senha}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoramento/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoramento/grafana/painel-cinzas.json:/var/lib/grafana/dashboards/painel-cinzas.json:ro
      - grafana_dados:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  dados:
  caddy_dados:
  caddy_config:
  prometheus_dados:
  grafana_dados:
  banco:                         # dados do PostgreSQL (perfil "postgres")

secrets:
  senha_banco:
    # perfil "postgres": CINZAS_DB_SENHA_ARQUIVO=./segredos/senha_banco.txt no .env (deploy/segredos/ está
    # no .gitignore). Sem o perfil não é usado: /dev/null, para o SQLite não exigir o arquivo.
    file: ${CINZAS_DB_SENHA_ARQUIVO:-/dev/null}
